<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proceed to Final Survey</title>
    <!-- Load Tailwind CSS for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div id="content-box" class="bg-white p-8 rounded-xl shadow-2xl text-center max-w-sm w-full">
        <!-- Main Message -->
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Final Step</h1>
        <p class="text-gray-600 mb-6">
            Your transaction log is complete. Please tap the button below to proceed to the final survey.
        </p>

        <!-- Dynamic Message Box -->
        <div id="message-box" class="bg-blue-50 p-4 rounded-lg text-sm text-blue-700 mb-6">
            <!-- Details loaded here -->
            Loading status...
        </div>

        <!-- The Manual Redirect Button (Final Survey Link) -->
        <a id="survey-link-button" 
           href="#" 
           target="_blank" 
           class="w-full inline-block py-3 px-4 bg-blue-600 text-white font-bold text-lg rounded-xl transition hover:bg-blue-700 shadow-xl active:scale-[0.99] cursor-pointer">
            <span id="button-text">Proceed to Survey</span>
        </a>
        
        <!-- Webview Fallback Message -->
        <p class="text-xs text-gray-500 mt-4">
            If the button doesn't open the survey, tap the three dots (<span class="font-bold">...</span>) and choose 'Open in Browser'.
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --------------------------------------------------------------------------------
            // 1. Configuration: UPDATE THESE TWO VALUES
            // --------------------------------------------------------------------------------
            // Base URL for your Google Form (get the long URL WITHOUT any entry.XXX parameters)
            const BASE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdL3A6kQ4S72x6wOOM2wkOROjR-IchgBhykB97v2otTTG1EXw/viewform";

            // Map the query parameters to your specific Google Form Entry IDs.
            // !!! YOU MUST REPLACE THESE PLACEHOLDER IDs WITH YOUR ACTUAL IDs !!!
            const ENTRY_ID_CONDITION = "entry.1234567890"; // <-- REPLACE THIS
            const ENTRY_ID_STATUS = "entry.0987654321";    // <-- REPLACE THIS
            // --------------------------------------------------------------------------------
            // --------------------------------------------------------------------------------

            const messageBox = document.getElementById('message-box');
            const surveyLinkButton = document.getElementById('survey-link-button');

            // 1. Get query parameters from the URL
            const urlParams = new URLSearchParams(window.location.search);
            const condition = urlParams.get('c'); // e.g., C1, C2, C3
            const status = urlParams.get('s');    // e.g., SUCCESS, ERROR

            if (!condition || !status) {
                // Handle missing parameters
                messageBox.innerHTML = 'Error: Missing condition (<span class="font-semibold">c</span>) or status (<span class="font-semibold">s</span>) parameters in the URL.';
                surveyLinkButton.style.display = 'none'; // Hide button on error
                console.error("Missing required URL parameters (c or s).");
                return;
            }

            // 2. Construct the final survey URL
            const finalSurveyUrl = `${BASE_FORM_URL}?${ENTRY_ID_CONDITION}=${condition}&${ENTRY_ID_STATUS}=${status}`;

            // 3. Update the button's href and display the details
            surveyLinkButton.href = finalSurveyUrl;
            
            messageBox.innerHTML = `
                Status Logged: <span class="font-semibold">${status}</span><br>
                Condition: <span class="font-semibold">${condition}</span><br>
                <span class="mt-2 block font-medium">Data successfully logged.</span>
            `;
            
            // NOTE: The automatic window.location.replace is now removed!
        });
    </script>
</body>
</html>
